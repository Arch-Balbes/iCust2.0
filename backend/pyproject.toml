[project]
name = "icust-backend"
version = "0.1.0"
description = "iCust MVP backend: API и фоновые задачи"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.15,<2",
    "pgvector>=0.3.6,<1",
    "redis>=5.2,<7",
    "arq>=0.26,<1",
    "minio>=7.2,<8",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "python-docx>=1.1,<2",
    "natasha>=1.6,<2",
    "fastembed>=0.5,<1",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "asgi-lifespan>=2.1,<3",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Тексты промптов и справочник — длинные строки естественного языка, переносить их нельзя без потери смысла
"app/ig1/prompts.py" = ["E501"]
"app/ig1/domains.py" = ["E501"]
"app/ig1/domain_catalog.py" = ["E501"]
"app/ig1/stenogram.py" = ["E501"]
"app/ig3/pipeline.py" = ["E501"]
"app/design/service.py" = ["E501"]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
# папка alembic/ с миграциями не должна считаться локальным пакетом
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*", "minio.*", "pgvector.*", "natasha.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
