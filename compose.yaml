# iCust MVP — локальный стек.
# Данные — в именованных томах внутри диска Docker Desktop (D:\Docker\wsl после переноса).
# Наружу порты открыты только на 127.0.0.1.
name: icust

x-backend: &backend
  build: ./backend
  # Ключи внешних API (Cloud.ru, Nexara) — в отдельном файле вне git (по умолчанию ./secrets.env, путь — SECRETS_ENV_FILE)
  env_file:
    - .env
    - path: ${SECRETS_ENV_FILE:-./secrets.env}
      required: false
  environment:
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
    MINIO_ENDPOINT: minio:9000
    DESIGN_URL: http://design:8000
  volumes: [models_cache:/models]  # локальные модели скачиваются один раз
  depends_on:
    models-init: { condition: service_completed_successfully }
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio: { condition: service_healthy }
  restart: unless-stopped

services:
  gateway:
    build: ./frontend
    ports: ["127.0.0.1:8090:80"]  # 8080 занят старым стеком «iCust 2.0 MVP»
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    <<: *backend
    command: ["arq", "app.worker.WorkerSettings"]

  # Том с моделями создаётся от root; приложение работает от uid 1000 — выдаём права один раз при старте
  models-init:
    image: busybox:1.37
    user: root
    command: ["sh", "-c", "chown -R 1000:1000 /models /design-models /design-processed"]
    volumes: [models_cache:/models, design_models:/design-models, design_processed:/design-processed]
    restart: "no"

  # Модуль коллеги: сегменты, гипотезы ценности, сценарий, офферы, дизайн (icust_module v1.0)
  design:
    build: ./design
    env_file:
      - path: ${SECRETS_ENV_FILE:-./secrets.env}
        required: false
    volumes:
      - ./data/design/raw:/data/raw:ro   # снапшот разметки 2026-11-09
      - design_processed:/data/processed
      - design_models:/models            # bge-m3 и reranker (~4,5 ГБ), скачиваются один раз
    depends_on:
      models-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3))['status']=='ok'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 1800s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-icust}
      POSTGRES_USER: ${POSTGRES_USER:-icust}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run scripts/new-env.ps1}"
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    # Официальные образы minio/minio сняты с Docker Hub (2025). Для локальной работы — зафиксированный
    # архивный образ Bitnami; для сервера выбрать поддерживаемый вариант (см. README).
    image: docker.io/bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-icust}
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:?run scripts/new-env.ps1}"
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-icust}
    volumes: [minio_data:/bitnami/minio/data]
    # 9000 — S3 API (браузер будет грузить записи по presigned URL), 9001 — веб-консоль
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  models_cache:
  design_processed:
  design_models:
  postgres_data:
  redis_data:
  minio_data:
