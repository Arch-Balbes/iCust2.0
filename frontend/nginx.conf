server {
    listen 80;
    server_name _;

    # Записи интервью до 2 ГБ (макет 08) загружаются через API потоком: без буферизации на шлюзе
    client_max_body_size 2100m;

    # DNS Docker: адрес api перечитывается, поэтому пересоздание контейнера api не ломает шлюз (иначе 502)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # Сборки с хэшем в имени кэшируются навсегда, index.html — никогда (иначе браузер держит старую версию)
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
